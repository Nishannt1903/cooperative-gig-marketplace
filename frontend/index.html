<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GigConnect - Cooperative Gig Marketplace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#" onclick="showPage('home')">
            🤝 GigConnect
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="#" onclick="showPage('home')">
                Home
            </a>

            <a class="nav-link" href="#" onclick="showPage('myGigs')">
                My Gigs
            </a>

            <button class="btn btn-primary ms-2"
                    onclick="showPage('postGig')">
                + Post Gig
            </button>

        </div>
    </div>
</nav>


<!-- ================= HOME ================= -->

<section id="home" class="page">

    <div class="hero text-center">

        <div class="container">

            <h1>Find Help. Help Others.</h1>

            <p>
                Connect with people in your community for
                small household and local tasks.
            </p>

            <button class="btn btn-primary"
                    onclick="showPage('postGig')">
                + Post a Gig
            </button>

        </div>

    </div>


    <div class="container mt-5">

        <h2 class="mb-4">Available Gigs</h2>

        <div id="gigContainer" class="row g-4">
            <!-- Gigs will be added by JavaScript -->
        </div>

    </div>

</section>


<!-- ================= POST GIG ================= -->

<section id="postGig" class="page d-none">

    <div class="container mt-5">

        <div class="form-container">

            <h2>Post a Gig</h2>

            <p class="text-muted">
                Tell your community what help you need.
            </p>

            <form id="gigForm">

                <div class="mb-3">

                    <label class="form-label">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        class="form-control"
                        placeholder="Example: Grocery Pickup"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="4"
                        placeholder="Describe the task..."
                        required
                    ></textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select id="category" class="form-select">

                        <option value="Household">
                            Household
                        </option>

                        <option value="Community">
                            Community
                        </option>

                        <option value="Delivery">
                            Delivery
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        placeholder="Example: Ambarnath"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Reward (₹)
                    </label>

                    <input
                        type="number"
                        id="reward"
                        class="form-control"
                        placeholder="200"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Deadline
                    </label>

                    <input
                        type="date"
                        id="deadline"
                        class="form-control"
                        required
                    >

                </div>


                <button type="submit" class="btn btn-primary">
                    Post Gig
                </button>

                <button
                    type="button"
                    class="btn btn-secondary ms-2"
                    onclick="showPage('home')">
                    Cancel
                </button>

            </form>

        </div>

    </div>

</section>


<!-- ================= GIG DETAILS ================= -->

<section id="gigDetails" class="page d-none">

    <div class="container mt-5">

        <div id="detailsContainer"></div>

    </div>

</section>


<!-- ================= MY GIGS ================= -->

<section id="myGigs" class="page d-none">

    <div class="container mt-5">

        <h2>My Gigs</h2>

        <p class="text-muted">
            Gigs posted or accepted by you.
        </p>

        <div id="myGigsContainer" class="row g-4">

            <!-- My gigs added by JavaScript -->

        </div>

    </div>

</section>


<!-- ================= RATING ================= -->

<section id="rating" class="page d-none">

    <div class="container mt-5">

        <div class="form-container text-center">

            <h2>Task Completed! 🎉</h2>

            <p>
                How was your experience?
            </p>

            <div class="stars">

                <span onclick="selectRating(1)">☆</span>
                <span onclick="selectRating(2)">☆</span>
                <span onclick="selectRating(3)">☆</span>
                <span onclick="selectRating(4)">☆</span>
                <span onclick="selectRating(5)">☆</span>

            </div>

            <textarea
                id="ratingComment"
                class="form-control mt-4"
                placeholder="Write a comment..."
                rows="3">
            </textarea>

            <button
                class="btn btn-primary mt-3"
                onclick="submitRating()">

                Submit Rating

            </button>

        </div>

    </div>

</section>


<script src="script.js"></script>

</body>
</html>
